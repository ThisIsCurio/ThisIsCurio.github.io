<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curio</title>
<meta name="description" content="Curio: space and science in about a minute, and an interactive companion for every video.">
<link rel="icon" href="assets/curio-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: the star map is the home page. The Sun is Curio; every video's companion
   is a world on its own orbit, newest farthest out. A plain list sits underneath. */
:root {
  --space: #070A10; --panel: #0E1420; --line: #1E2838; --orbit: #26324A; --star: #E9EEF5; --dim: #8B97A8;
  --white: #F2F6FA; --blue: #3FA9FF; --light: #2FD4FF; --sun: #FFB347;
  --logo: "Inter", "Segoe UI", system-ui, sans-serif;
  --display: "Sora", "Segoe UI", system-ui, sans-serif;
  --body: "Sora", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--space); color: var(--star); font: 16px/1.55 var(--body);
  background-image: radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 78% 9%, #fff6 50%, transparent 51%),
    radial-gradient(1px 1px at 44% 63%, #fff5 50%, transparent 51%), radial-gradient(1.5px 1.5px at 63% 34%, #fff9 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 45%, #fff4 50%, transparent 51%), radial-gradient(1px 1px at 88% 52%, #fff6 50%, transparent 51%);
  background-size: 420px 420px;
}
main {
  max-width: 820px; margin: 0 auto; display: grid; gap: 28px;
  padding-block: max(32px, env(safe-area-inset-top, 0px)) 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 40px; height: 40px; flex: none; }
.brand span { font: 800 34px/1 var(--logo); letter-spacing: -0.5px; color: var(--white); }
h1 { font: 700 clamp(28px, 6vw, 44px)/1.08 var(--display); margin: 0 0 8px; text-wrap: balance; }
p { margin: 0; color: var(--dim); max-width: 60ch; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--light); }

.map { position: relative; width: 100%; aspect-ratio: 400 / 230; max-width: 100%; margin: 0 auto; }
.map svg { width: 100%; height: 100%; display: block; overflow: visible; }
.orbit { fill: none; stroke: var(--orbit); stroke-width: 1; }
.world { cursor: pointer; will-change: transform; }
.world .hit { fill: transparent; }
.world.soon { cursor: default; }
/* Planet labels live in an HTML layer above the map. Each label is rasterised once
   into its own GPU layer and only slid around, so its letters never re-render
   (and never shimmer) as the world drifts. */
.labels { position: absolute; inset: 0; pointer-events: none; }
.tag {
  position: absolute; left: 0; top: 0; will-change: transform; backface-visibility: hidden;
  display: grid; justify-items: center; text-align: center; white-space: nowrap;
  text-shadow: 0 0 6px #070A10, 0 0 2px #070A10;
}
.tag b { font: 500 1em/1.25 var(--body); letter-spacing: .01em; color: var(--star); }
.tag span { font: 400 .78em/1.3 var(--body); color: var(--dim); }
.tag.soon b { font: italic 400 .86em/1.25 var(--body); color: var(--dim); }
.world:focus-visible { outline: none; }
.world:focus-visible .ring, .world:hover .ring { stroke: var(--light); stroke-width: 2; }
.ring { fill: none; stroke: transparent; }
.hint { text-align: center; font-size: 13px; color: var(--dim); }

.list { display: grid; gap: 10px; }
.item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  color: inherit; text-decoration: none;
}
a.item:hover, a.item:focus-visible { border-color: var(--light); outline: none; }
.item b { display: block; font: 700 17px/1.2 var(--display); }
.item span { font-size: 13px; color: var(--dim); }
.item .go { font: 500 13px var(--mono); color: var(--light); white-space: nowrap; }
.item.soon b { color: var(--dim); font-weight: 500; }
footer { font-size: 12px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { .map { --still: 1; } }
</style>
</head>
<body>
<main>
  <header class="brand" aria-label="Curio">
    <svg viewBox="0 0 40 40" aria-hidden="true"><g transform="translate(20 20)"><circle r="15" fill="none" stroke="#F2F6FA" stroke-width="2"/><circle r="4" fill="#F2F6FA"/><circle cx="15" cy="0" r="3.6" fill="#3FA9FF"/></g></svg>
    <span>curio</span>
  </header>
  <section>
    <h1>Watch the idea. Then play with it.</h1>
    <p>Every Curio video is a world on this map. Tap one to explore its companion and try the idea for yourself.</p>
  </section>

  <section class="map" aria-label="Star map of Curio companions">
    <svg id="map" viewBox="-200 -115 400 230" role="group"></svg>
    <div class="labels" id="labels" aria-hidden="true"></div>
  </section>
  <div class="hint">New worlds appear with every video.</div>

  <section class="list" aria-labelledby="all-h">
    <div class="eyebrow" id="all-h">All companions</div>
    <div class="list" id="list"></div>
  </section>
  <footer>Curio · space and science in about a minute.</footer>
</main>

<script>
// Add a companion: one entry here (newest last). Entries without href show as "coming soon".
const WORLDS = [
  { title: "Light-Day Explorer", video: "One Light-Day Out", href: "voyager/", color: "#2FD4FF", desc: "Track Voyager 1 live and send a message at light speed." },
  { title: "Next video", video: "Coming soon" },
  { title: "Next video", video: "Coming soon" },
];

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const TILT = 0.42; // orbit flattening: a slightly tilted view of the plane

// The Sun is Curio itself: a warm core with a soft corona.
const defs = el("defs", {});
const g = el("radialGradient", { id: "corona" }, defs);
el("stop", { offset: "0%", "stop-color": "#FFB347", "stop-opacity": ".55" }, g);
el("stop", { offset: "100%", "stop-color": "#FFB347", "stop-opacity": "0" }, g);
el("circle", { r: 58, fill: "url(#corona)" });
el("circle", { r: 18, fill: "#FFB347" });
el("circle", { r: 12, fill: "#FFD27A" });

const labels = document.getElementById("labels");
const worlds = WORLDS.map((w, i) => {
  const r = 70 + i * 52;
  el("ellipse", { class: "orbit", rx: r, ry: r * TILT, "stroke-dasharray": w.href ? "" : "3 6" });
  const node = w.href ? el("a", { href: w.href, class: "world", "aria-label": `${w.title}, from the video ${w.video}` })
                      : el("g", { class: "world soon", "aria-hidden": "true" });
  const size = w.href ? 11 : 6;
  el("circle", { class: "hit", r: 26 }, node);
  el("circle", { class: "ring", r: size + 6 }, node);
  el("circle", { r: size, fill: w.color || "#4A5568" }, node);
  if (w.href) el("circle", { r: size * 0.45, cx: -size * 0.3, cy: -size * 0.3, fill: "#ffffff", opacity: ".35" }, node);
  const tag = document.createElement("div");
  tag.className = "tag" + (w.href ? "" : " soon");
  tag.innerHTML = w.href ? `<b>${w.title}</b><span>from ${w.video}</span>` : "<b>coming soon</b>";
  labels.appendChild(tag);
  return { node, tag, size, r, speed: 0.045 / (1 + i * 0.7), phase: -0.6 + i * 2.1 };
});

// Label size follows the map's size; set only on load and resize so the text
// is never re-rasterised during the orbit animation.
const sizeLabels = () => { labels.style.fontSize = Math.max(14, Math.min(26, 14 * svg.clientWidth / 400)).toFixed(1) + "px"; };
sizeLabels();
addEventListener("resize", sizeLabels);

// Gentle orbits (paused for reduced motion), with nearer worlds drawn on top.
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const t0 = performance.now();
let lastOrder = "";
function place(now) {
  const t = still ? 0 : (now - t0) / 1000;
  const k = svg.clientWidth / 400; // map units -> CSS pixels (viewBox is 400 wide)
  for (const w of worlds) {
    const a = w.phase + t * w.speed;
    const x = Math.cos(a) * w.r, y = Math.sin(a) * w.r * TILT;
    // CSS transforms are composited on the GPU at sub-pixel precision.
    w.node.style.transform = `translate(${x.toFixed(3)}px, ${y.toFixed(3)}px)`;
    // Label: centred above the planet, in screen pixels.
    const lx = (x + 200) * k, ly = (y + 115 - w.size - 6) * k;
    w.tag.style.transform = `translate3d(${lx.toFixed(2)}px, ${ly.toFixed(2)}px, 0) translate(-50%, -100%)`;
    w.y = Math.sin(a);
  }
  // Re-stack only when the depth order actually changes (re-inserting every frame causes hitches).
  const order = [...worlds].sort((a, b) => a.y - b.y);
  const key = order.map((w) => worlds.indexOf(w)).join();
  if (key !== lastOrder) { order.forEach((w) => svg.appendChild(w.node)); lastOrder = key; }
  if (!still) requestAnimationFrame(place);
}
requestAnimationFrame(place);

// The list underneath: every companion, newest first, plus one "coming soon".
const list = document.getElementById("list");
const live = WORLDS.filter((w) => w.href).reverse();
for (const w of [...live, { video: "Next video" }]) {
  const item = document.createElement(w.href ? "a" : "div");
  item.className = "item" + (w.href ? "" : " soon");
  if (w.href) item.href = w.href;
  item.innerHTML = w.href
    ? `<div><b>${w.title}</b><span>${w.video} · ${w.desc}</span></div><span class="go">Open →</span>`
    : `<div><b>${w.video}</b><span>A new world arrives with the next video.</span></div>`;
  list.appendChild(item);
}
</script>
</body>
</html>
